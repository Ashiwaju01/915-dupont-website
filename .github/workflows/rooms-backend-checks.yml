name: Rooms backend checks

on:
  pull_request:
    paths:
      - "supabase/**"
      - "admin/**"
      - "index.html"
      - "script.js"
      - ".github/workflows/rooms-backend-checks.yml"
  push:
    branches: ["main", "feature/rooms-backend-foundation"]
    paths:
      - "supabase/**"
      - "admin/**"
      - ".github/workflows/rooms-backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check JavaScript syntax
        run: |
          node --check admin/admin.js
          node --check script.js

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check reservation Edge Function
        run: deno check supabase/functions/reservation-create/index.ts

      - name: Check patch whitespace
        run: git diff --check

      - name: Check migration version uniqueness
        shell: bash
        run: |
          duplicates="$(find supabase/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate migration versions: $duplicates"
            exit 1
          fi

      - name: Start local Supabase services
        run: supabase start

      - name: Lint database migrations
        run: supabase db lint --local

      - name: Run database tests
        run: supabase test db

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
